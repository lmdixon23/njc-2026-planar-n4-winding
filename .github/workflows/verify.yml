name: verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-all:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended lmodern poppler-utils

      - name: Install Python dependencies
        run: python -m pip install -r requirements-lock.txt

      - name: Run maintained checks
        run: bash run_all.sh

      - name: Compile manuscript
        working-directory: paper
        run: |
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          pdflatex -interaction=nonstopmode -halt-on-error main.tex

          echo "--- undefined references and citations ---"
          if grep -E "undefined references|Citation .* undefined|Reference .* undefined" main.log; then
            echo "FAIL: unresolved cross-references"
            exit 1
          fi

          echo "--- overfull and underfull boxes ---"
          if grep -E "Overfull \\\\hbox|Underfull \\\\hbox" main.log; then
            echo "FAIL: box warnings"
            exit 1
          fi

          echo "--- font embedding ---"
          pdffonts main.pdf
          if pdffonts main.pdf | tail -n +3 | awk '{ if ($(NF-4) != "yes" || $(NF-3) != "yes") exit 1 }'; then
            echo "all fonts embedded and subset"
          else
            echo "FAIL: a font is not embedded or not subset"
            exit 1
          fi
          if pdffonts main.pdf | grep -q "Type 3"; then
            echo "FAIL: Type 3 font present"
            exit 1
          fi
